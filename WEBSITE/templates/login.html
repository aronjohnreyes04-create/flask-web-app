<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{url_for('static', filename='login.css')}}">
</head>
<body>
    <div id="sign">
    <h1>Sign in as an Administrator</h1>
    <p>Input username and password for administrator</p>
    <form action="/login" method='POST' id="login" name="login">
        <div>
            <label for="user">Username</label>
            <input type="text" id="user" name="user" required>
        </div>
        <div>
        <label for="pass">Password</label>
        <input type="password" id="pass" name="pass" maxlength="10" required>
        
            <button type="submit" id="button"> Log in</button>
        </div>

    </form>
    </div>
</body>
</html>
